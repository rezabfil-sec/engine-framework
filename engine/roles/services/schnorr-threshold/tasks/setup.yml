---
# Consider for binaries and given version e.g., 22.04 ubuntu
- name: check if file is present
  stat:
    path: '{{ data_folder }}/software/threshold_schnorr_binaries.tar.gz'
  delegate_to: localhost
  connection: local
  register: schnorr_tarball_present

# Dir of previous work is ready
- name: check if dir is present on node
  stat:
    path: '{{ data_path }}/schnorr-threshold/tres/'
  register: repo_ready

# binary in place from previous run
- name: check if binary is present on node
  stat:
    path: '/root/tres'
  register: binary_ready

- name: create experiment tmp dir
  file:
    path: "{{ experiment_folder }}"
    state: directory
  delegate_to: localhost
  connection: local

# Building from source
- block:
  - name: check if cargo is installed
    shell: cargo -V
    register: cargo_exists
    ignore_errors: true

  - name: Download Installer
    when: cargo_exists is failed
    get_url:
      url: https://sh.rustup.rs
      dest: /tmp/sh.rustup.rs
      mode: '0755'
      force: 'yes'
    tags:
      - rust

  - name: install rust/cargo
    when: cargo_exists is failed
    shell: /tmp/sh.rustup.rs -y
    tags:
      - rust
  when: (not schnorr_tarball_present.stat.exists and not repo_ready.stat.exists) or (service.role is defined and service.role == 'dalek_bench')

- block: 
  - name: copy repository to the source
    copy:
      src: files/tres
      dest: '{{ data_path }}/schnorr-threshold'

  - name: copy frost to the source
    copy:
      src: files/frost-borg
      dest: '{{ data_path }}/schnorr-threshold'

  - name: building the binaries
    command: "/root/.cargo/bin/cargo build --release"
    args:
      chdir: /{{ data_path }}/schnorr-threshold/tres

  - name: copy binaries to localhost
    fetch:
      src: '{{ data_path }}/schnorr-threshold/tres/target/release/{{ binary_name }}'
      dest: '{{ experiment_folder }}/'
      flat: true
    loop: ["bench", "tres"]
    loop_control:
      loop_var: binary_name
    run_once: true
    # FIXME: add here option to archive binaries
    # - name: archive binaries

  when: not schnorr_tarball_present.stat.exists and not repo_ready.stat.exists
  # when: not schnorr_tarball_present.stat.exists and repo_ready.stat.exists
# prepare binaries on source when they are found
- block:
  # - name: Creates directory
  #   file:
  #     path: '{{ schnorr_tmp_dir }}'
  #     state: directory
  #   delegate_to: localhost
  #   connection: local
  
  # - name: Find out playbook's path
  #   shell: pwd
  #   register: playbook_path_output
  #   delegate_to: localhost
  #   connection: local
  # - debug: var=playbook_path_output.stdout
  
  - name: uncompress the schnorr binaries
    shell: 'tar -xf {{ data_folder }}/software/threshold_schnorr_binaries.tar.gz -C {{ experiment_folder }}'
    delegate_to: localhost
    connection: local
  when: schnorr_tarball_present.stat.exists

- name: copy tres to a node file
  copy:
    src: '{{ experiment_folder }}/tres'
    dest: '/root/'
    mode: '0755'
  when: not binary_ready.stat.exists and service.role is defined and service.role == 'setup'


- block:
  - name: update list of packages
    apt: update_cache=yes force_apt_get=yes
    become: true
  - name: install linux dependencies
    apt:
      name:
        - bison
        - flex
  - name: install extra packages
    apt:
      name:
        - python3-pip
        - nftables
        - rsync
        - expect
        - curl
        - fio
        - iftop
        - htop
        - ethtool
        - bc
      state: present
  - name: install python packages
    pip:
      name:
        - pandas==1.3.5
  when: is_container is defined and container_runtime == 'lxc'