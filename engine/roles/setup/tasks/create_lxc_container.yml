- name: add additional user container config
  lxc_container:
    name: "{{ container.name }}"
    state: stopped
    container_config: "{{ container.lxc_config }}"
  when: container.lxc_config is defined

- name: start container
  lxc_container:
    name: "{{ container.name }}"
    state: started

- name: set container facts
  set_fact:
    con_rootfs: "/var/lib/lxc/{{ container.name }}/rootfs"
#    con_ip: "{{ lxc_subnet_prefix }}.{{ container_index + 2 }}"

#- name: add container to dnsmasq hosts
#  lineinfile:
#    path: "{{ lxc_dhcp_hosts }}"
#    line: "{{ container.name }},{{ con_ip }}"

- name: install dependencies
  lxc_container:
    name: "{{ container.name }}"
    container_command: "apt-get -y install openssh-server python3 curl rsync"

#- name: install dependencies
#  shell: |
#    {{ con_exec }} apt-get -y install openssh-server python3 curl rsync

- name: add ssh authorized keys
  shell: |
    mkdir {{ con_rootfs }}/root/.ssh
    cp ~/.ssh/authorized_keys {{ con_rootfs }}/root/.ssh/authorized_keys

