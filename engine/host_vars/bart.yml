---
# variables for node bart

# hard drive to store data
data_disk: "sda"

# network card
num_interfaces: 4
node_ifaces:
  1:
    name: 'enp3s0'
    mac: '6c:b3:11:52:55:00'
    phc: '/dev/ptp0'
    clock: '6cb311.fffe.525500-1'
    bandwidth: 1
    sriov: no
  2:
    name: 'enp4s0'
    mac: '6c:b3:11:52:55:01'
    phc: '/dev/ptp1'
    clock: '6cb311.fffe.525500-2'
    bandwidth: 1
    sriov: no
  3:
    name: 'enp5s0'
    mac: '6c:b3:11:52:55:02'
    phc: '/dev/ptp2'
    clock: '6cb311.fffe.525500-3'
    bandwidth: 1
    sriov: no
  4:
    name: 'enp6s0'
    mac: '6c:b3:11:52:55:03'
    phc: '/dev/ptp3'
    clock: '6cb311.fffe.525500-4'
    bandwidth: 1
    sriov: no

# Total number of CPUs
# Hyper threading is on, so 8 vCPUs 
number_vCPUs: 8
# Unit in GB
total_RAM: 16

management_iface: enp0s25