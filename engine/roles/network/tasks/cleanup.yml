---
# Cleanup network

- block:
  - name: reset queuing disciplines
    command: tc qdisc del dev {{ iface.value.name }} root
    loop: '{{ node_ifaces | dict2items }}'
    # when: tsn_config | length > 0
    loop_control:
      loop_var: 'iface'
    check_mode: no
    ignore_errors: yes
    tags: qdisc


  - name: reinitialize ovs - delete flow interfaces
    include_role:
      name: roles/setup
      tasks_from: setup_ovs.yml
    tags: ovs
    when: network_config == "OvS"

- block:
  - name: reset queuing disciplines
    command: tc qdisc del dev {{ iface.value.name }} root
    loop: '{{ node_ifaces | dict2items }}'
    # when: tsn_config | length > 0
    loop_control:
      loop_var: 'iface'
    check_mode: no
    ignore_errors: yes
    tags: qdisc

  - name: reinitialize ovs - delete flow interfaces
    include_role:
      name: roles/setup
      tasks_from: setup_ovs.yml
    tags: ovs
    when: network_config == "OvS"

# This must not be done in containers. SR-IOV is controlled on physical host.
# Container does not even have modprobe
- block:
  - name: reinitialize sriov - delete virtual interfaces
    include_role:
      name: roles/setup
      tasks_from: setup_sriov.yml
    tags: sriov
  
  - name: reset queuing disciplines
    command: tc qdisc del dev {{ iface.value.name }} root
    loop: '{{ node_ifaces | dict2items }}'
    # when: tsn_config | length > 0
    loop_control:
      loop_var: 'iface'
    check_mode: no
    ignore_errors: yes
    tags: qdisc
  when: network_config == "SRIOV" and is_container is not defined
