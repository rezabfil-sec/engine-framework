  #   name: 'eno1'
  #   mac: 'ac:1f:6b:7c:86:4e'
  #   phc: '/dev/ptp5'
  #   offload: no
  1:
    name: 'eno2'
    mac: 'ac:1f:6b:7c:86:4f'
    phc: '/dev/ptp7'
    offload: no
    sriov: no
  2:
    name: 'eno3'
    mac: 'ac:1f:6b:7c:86:50'
    phc: '/dev/ptp5'
    offload: no
    sriov: no
  3:
    name: 'eno4'
    mac: 'ac:1f:6b:7c:86:51'
    phc: '/dev/ptp7'
    offload: no
    sriov: no
  4:
    name: 'eno5'
    mac: 'ac:1f:6b:7c:86:52'
    phc: '/dev/ptp5'
    offload: no
    sriov: no
  5:
    name: 'eno6'
    mac: 'ac:1f:6b:7c:86:53'
    phc: '/dev/ptp7'
    offload: no
    sriov: no
