---
- block:
  # Consider for binaries and given version e.g., 22.04 ubuntu
  # Check where we have binaries or not
  - name: check if file is present
    stat:
      path: '{{ data_folder }}/software/threshold_ecdsa_binaries_lxc.tar.gz'
    delegate_to: localhost
    connection: local
    register: ecdsa_tarball_present
  # original binary created
  - name: check if dir is present on node
    stat:
      path: '{{ data_path }}/ecdsa-threshold/bench/target/release/rust-impl'
    register: repo_ready
  # binary in place from previous run
  - name: check if binary is present on node
    stat:
      path: '/root/rust-impl'
    register: binary_ready

  - name: create experiment tmp dir
    file:
      path: "{{ experiment_folder }}"
      state: directory
    delegate_to: localhost
    connection: local

  # Building from source
  - block:
    - name: check if cargo is installed
      shell: cargo -V
      register: cargo_exists
      ignore_errors: true

    - name: Download Installer
      get_url:
        url: https://sh.rustup.rs
        dest: /tmp/sh.rustup.rs
        mode: '0755'
        force: 'yes'
      tags:
        - rust
      when: cargo_exists is failed

    - name: install rust/cargo
      shell: /tmp/sh.rustup.rs -y
      tags:
        - rust
      when: cargo_exists is failed

    - name: install linux dependencies
      apt:
        name:
          - libgmp-dev

    - name: copy repository to the source
      copy:
        src: files/bench
        dest: '{{ data_path }}/ecdsa-threshold'

    - name: building the binaries
      command: "/root/.cargo/bin/cargo build --release"
      args:
        chdir: /{{ data_path }}/ecdsa-threshold/bench/

    - name: copy binaries to localhost
      fetch:
        src: '{{ data_path }}/ecdsa-threshold/bench/target/release/rust-impl'
        dest: '{{ experiment_folder }}/'
        flat: true
      run_once: true
      # FIXME: add here option to archive binaries
      # - name: archive binaries
    when: not ecdsa_tarball_present.stat.exists and not repo_ready.stat.exists and not binary_ready.stat.exists

  # Do not build, copy from source
  - name: uncompress the ecdsa binaries
    shell: 'tar -xf {{ data_folder }}/software/threshold_ecdsa_binaries_lxc.tar.gz -C {{ experiment_folder }}'
    delegate_to: localhost
    connection: local
    # Each individual node then copies the binaries to corresponding parts
    when: ecdsa_tarball_present.stat.exists and not binary_ready.stat.exists

  - name: copy binaries to localhost
    fetch:
      src: '/root/rust-impl'
      dest: '{{ experiment_folder }}/'
      flat: true
    run_once: true
    when: binary_ready.stat.exists

  - name: copy binaries to from dir
    fetch:
      src: '{{ data_path }}/ecdsa-threshold/bench/target/release/rust-impl'
      dest: '{{ experiment_folder }}/'
      flat: true
    run_once: true
    when: repo_ready.stat.exists

  ## Starts setup of stuff, assumes rust-impl in place
  - name: copy bench to a node file
    copy:
      src: '{{ experiment_folder }}/rust-impl'
      dest: '/root/'
      mode: '0755'
    when: not binary_ready.stat.exists
  when: service.role is defined and service.role == 'setup'
- block:
  - name: update list of packages
    apt: update_cache=yes force_apt_get=yes
    become: true
  - name: install extra packages
    apt:
      name:
        - python3-pip
        - nftables
        - rsync
        - expect
        - curl
        - fio
        - iftop
        - htop
        - ethtool
        - bc
      state: present
# Relevant dependency to other bits
  - name: install python packages
    pip:
      name:
        - pyyaml
  when: is_container is defined and container_runtime == 'lxc'