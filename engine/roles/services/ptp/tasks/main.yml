---
# PTP service
# Precision-Time-Protocol daemons and processes
#
# Usage in stack:
# - { name: ptp, mode: linuxptp/excelfore }
#
# IDEA put checkclock in a wrapper script, continously call it and log output

# reset clock processes
- name: kill running clock processes
  command: 'pkill -f {{ item }}'
  loop: ["ptp4l", "phc2sys", "gptp2d", "checkclock", "ptp_master"]
  ignore_errors: yes

- name: disable ntp
  command: timedatectl set-ntp false

- name: oneshot system clock update
  shell: date -s "$(date -d "$(curl -sI google.com| grep -i '^date:'|cut -d' ' -f2-)" | xargs -I {} date --date='{}' "+%Y-%m-%d %H:%M:%S")"

- name: extract duplicates (if present)
  set_fact:
    used_hw_ifaces: "{{ used_hw_ifaces | default([]) | unique }}"
  when: network_config == "SRIOV"

# -------------------- linuxptp SYNC --------------------
- block:
  - name: set linuxptp config files
    template:
      src: 'gPTP.cfg'
      dest: '{{ data_path }}/gPTP.cfg'
      mode: '0644'
# TODO update socket priority option
  - name: start linuxptp for active interfaces
    shell: >
      run_service {{ 1 if service.signal | default(false) else 0 }} {{ service.wait | default(0) }} 0
      ptp4l -f {{ data_path }}/gPTP.cfg --step_threshold=1 -H
    async: 2592000  # run in background - for 1 month or until finished/killed
    poll: 0

  - name: set TAI-UTC offset
    shell: 'pmc -u -b 0 -t 1 -i {{ item.value.name }} "SET GRANDMASTER_SETTINGS_NP clockClass 248 clockAccuracy 0xfe offsetScaledLogVariance 0xffff currentUtcOffset 37 leap61 0 leap59 0 currentUtcOffsetValid 1 ptpTimescale 1 timeTraceable 1 frequencyTraceable 0 timeSource 0xa0"'
    loop: '{{ node_ifaces | dict2items }}'
# TODO socket priority option
  - name: sync primary clock -> hw clocks
    shell: >
      run_service {{ 1 if service.signal | default(false) else 0 }} {{ service.wait | default(0) }} 0
      phc2sys -a -r --step_threshold=1 --transportSpecific=1 -x -E pi
    async: 2592000  # run in background - for 1 month or until finished/killed
    poll: 0
  when: service.mode == 'linuxptp' or service.mode == 'lidar_all' and (network_config == 'Physical' or network_config == 'OvS') and use_ifaces is defined and use_ifaces | length > 0
- debug: var=use_ifaces

# -------------------- linuxptp SWITCH --------------------
- block:
  - name: set linuxptp config files
    template:
      src: 'gPTPSwitch.cfg'
      dest: '{{ data_path }}/gPTPSwitch.cfg'
      mode: '0644'
# TODO update socket priority option
  - name: start linuxptp for active interfaces
    shell: >
      run_service {{ 1 if service.signal | default(false) else 0 }} {{ service.wait | default(0) }} 0
      ptp4l -f {{ data_path }}/gPTPSwitch.cfg --step_threshold=1 -H
    async: 2592000  # run in background - for 1 month or until finished/killed
    poll: 0

  - name: set TAI-UTC offset
    shell: 'pmc -u -b 0 -t 1 -i {{ item.value.name }} "SET GRANDMASTER_SETTINGS_NP clockClass 248 clockAccuracy 0xfe offsetScaledLogVariance 0xffff currentUtcOffset 37 leap61 0 leap59 0 currentUtcOffsetValid 1 ptpTimescale 1 timeTraceable 1 frequencyTraceable 0 timeSource 0xa0"'
    loop: '{{ node_ifaces | dict2items }}'
# TODO socket priority option
  - name: sync primary clock -> hw clocks
    shell: >
      run_service {{ 1 if service.signal | default(false) else 0 }} {{ service.wait | default(0) }} 0
      phc2sys -a -r --step_threshold=1 --transportSpecific=1 -x -E pi
    async: 2592000  # run in background - for 1 month or until finished/killed
    poll: 0
  when: service.mode == 'switch_mode' and use_ifaces is defined and use_ifaces | length > 0 and network_config == 'Physical'

- block:
  - name: set linuxptp config files
    template:
      src: 'gPTPSRIOV.cfg'
      dest: '{{ data_path }}/gPTPSRIOV.cfg'
      mode: '0644'
# TODO update socket priority option
  - name: start linuxptp for active interfaces
    shell: >
      run_service {{ 1 if service.signal | default(false) else 0 }} {{ service.wait | default(0) }} 0
      ptp4l -f {{ data_path }}/gPTPSRIOV.cfg --step_threshold=1 -H
    async: 2592000  # run in background - for 1 month or until finished/killed
    poll: 0

  - name: set TAI-UTC offset
    shell: 'pmc -u -b 0 -t 1 -i {{ item }} "SET GRANDMASTER_SETTINGS_NP clockClass 248 clockAccuracy 0xfe offsetScaledLogVariance 0xffff currentUtcOffset 37 leap61 0 leap59 0 currentUtcOffsetValid 1 ptpTimescale 1 timeTraceable 1 frequencyTraceable 0 timeSource 0xa0"'
    loop: '{{ used_hw_ifaces }}'
# TODO socket priority option
  - name: sync primary clock -> hw clocks
    shell: >
      run_service {{ 1 if service.signal | default(false) else 0 }} {{ service.wait | default(0) }} 0
      phc2sys -a -r --step_threshold=0.00002 --transportSpecific=1 -x -E pi
    async: 2592000  # run in background - for 1 month or until finished/killed
    poll: 0
  - name: sync primary clock -> wall
    shell: >
      run_service {{ 1 if service.signal | default(false) else 0 }} {{ service.wait | default(0) }} 0
      phc2sys -s '{{ used_hw_ifaces[0] }}' -c CLOCK_REALTIME --step_threshold=0.00002 --transportSpecific=1 -x -E pi -w
    async: 2592000  # run in background - for 1 month or until finished/killed
    poll: 0
  when: service.mode == 'switch_mode' and used_hw_ifaces is defined and used_hw_ifaces | length > 0 and network_config == 'SRIOV'

