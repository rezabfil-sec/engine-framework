---
# dependencies
- block:
  # apt commands in case of container
  - name: update list of packages
    apt: update_cache=yes force_apt_get=yes
    become: true
  # - name: install linux dependencies
  #   apt:
  #     name:
  #       - bison
  #       - flex
  - name: install extra packages
    apt:
      name:
        - python3-pip
        - rsync
        - expect
        - curl
        - fio
        - iftop
        - htop
        - ethtool
        - bc
        - libgmp3-dev
      state: present
  - name: install python packages
    pip:
      name:
        - pandas==1.3.5
  when: is_container is defined and container_runtime == 'lxc'

## installation of base
- name: Check if binary already present
  stat:
    path: '{{ data_folder }}/software/threshold-bls'
  delegate_to: localhost
  connection: local
  register: binary_present
  
- block:
  # install cargo and build binaries
  - name: check if cargo is installed
    shell: cargo -V
    register: cargo_exists
    ignore_errors: true

  - name: Download Installer
    when: cargo_exists is failed
    get_url:
      url: https://sh.rustup.rs
      dest: /tmp/sh.rustup.rs
      mode: '0755'
      force: 'yes'

  - name: install rust/cargo
    when: cargo_exists is failed
    shell: /tmp/sh.rustup.rs -y

  - name: install libgmp
    when: cargo_exists is failed
    shell: apt -y install libgmp3-dev

  - name: copy repository to the source
    copy:
      src: 'files/{{ repo_name }}'
      dest: '{{ bls_dir }}'
    loop: ['bls-codebase','multi-party-bls']
    loop_control:
      loop_var: repo_name

  - name: building the binaries
    command: "/root/.cargo/bin/cargo build --release"
    args:
      chdir: '/{{ bls_dir }}/bls-codebase'

  - name: copy binaries to localhost
    fetch:
      src: '/{{ bls_dir }}/bls-codebase/target/release/{{ binary_name }}'
      dest: '{{ data_folder }}/software/'
      flat: true
    run_once: true
    loop: [ 'threshold-bls','bench' ]
    loop_control:
      loop_var: binary_name
  when: not binary_present.stat.exists and service.role is defined and service.role == 'setup'
