[package]
name = "rust-impl"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
round-based = "0.1.6"
tokio = { version = "1.15.0", features = ["full"] }
multi-party-ecdsa = { git = "https://github.com/ZenGo-X/multi-party-ecdsa.git" }
futures = "0.3.19"
anyhow = "1.0.52"
tokio-stream = "0.1.8"
serde = "1.0.133"
byteorder = "1.4.3"
serde_json = "1.0.74"
bincode = "1.3.3"
serde_yaml = "0.8.23"
sieve = { git = "https://github.com/Distributed-EPFL/sieve", features = ["system"]}
drop = { git = "https://github.com/Distributed-EPFL/drop", features = ["system", "test"]}
hex = "0.4.3"
async-trait = "0.1.52"
curv-kzen = { version = "0.9", default-features = false }
sha2 = "0.9"
aes-gcm = "0.9.4"
rand = "0.8"
kzen-paillier = { version = "0.4.2", default-features = false }
zk-paillier = { version = "0.4.2", default-features = false }
k256 = { version = "0.10.2", features = ["serde"] }
indicatif = { version = "0.16.2" }
do-notation = { version = "0.1.3" }
