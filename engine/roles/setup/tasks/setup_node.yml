---
# Basic node setup

# not needed yet - maybe for post-processing
# - name: checkout toolchain repository
#   git:
#     repo: 'https://{{ git_toolchain_user }}:{{ git_toolchain_token }}@{{ git_toolchain_repo }}'
#     dest: '{{ data_path }}/toolchain'
#     version: '{{ git_toolchain_branch }}'
#     update: yes

# grab time from internet and perform one time update
- name: oneshot system clock update
  shell: date -s "$(date -d "$(curl -sI google.com| grep -i '^date:'|cut -d' ' -f2-)" | xargs -I {} date --date='{}' "+%Y-%m-%d %H:%M:%S")"
  register: dateupdate
  when: is_container is not defined

- debug: msg="{{ dateupdate.stdout }}"
  when: is_container is not defined


# install packages not included in the node base image
- block: 
  - name: update list of packages
    apt: update_cache=yes force_apt_get=yes
    
  - name: install linux dependencies
    apt: 
      name:
        - bison
        - flex
  
  # NOTE -- please append changes made here to the EnGINE Dockerfiles
  - name: install extra packages
    apt:
      name:
        - libcmocka-dev
        - pkg-config
        - cgroup-tools
        # - python3-apt
        - python3-pip
        - scapy
        - nftables
        # - openvswitch-switch
        # - ethtool
        # - iperf3
        - gnuplot
        - libtool
        - autoconf
        - libsodium-dev
        - libb2-dev
        - tshark
        - rsync
        - software-properties-common
        - curl
        - expect
        - bc
        - fio
        - iftop
        - htop
        - ethtool
        # Install stuff needed to compile netperf/netserver
        # NOTE! This can be removed as soon as we include netperf in the image!
        # - autotools-dev
        # - automake
        # - texinfo
      state: present

  # install python packages not included in the node base image
  # NOTE -- please append changes made here to the EnGINE Dockerfiles

  - name: remove externally-managed
    file:
      path: /usr/lib/python3.11/EXTERNALLY-MANAGED
      state: absent
    ignore_errors: true

  - name: install python packages
    pip:
      name:
        - psutil
        - seaborn
        - pandas==1.3.5
        - pypacker
        - matplotlib==3.5.3
        - numpy==1.24.3
        - netifaces
        - python-ndn
        - web3
        - eth-keys
  # each container set up in own service or part of dockerfile
  when: is_container is not defined
  #or (is_container and container_runtime != 'lxc') or (is_container and container_runtime != 'containerd')
  # when: is_container is not defined or (is_container and container_runtime != 'containerd')

- name: install - lxc-utils
  apt:
    name: lxc-utils
    state: present
  when: (is_container is defined and not is_container) and container_runtime == 'lxc' and gcp is not defined

# distribute service and experiment script
- name: copy service and experiment script to nodes
  template:
    src: '{{ item }}.sh'
    dest: '/usr/local/bin/{{ item }}'
    mode: '0755'
  loop:
    - "run_experiment"
    - "run_service"
    - "run_service_action"

- name: create data folder
  file:
    path: '{{ data_path }}'
    mode: '0775'
    state: directory


# format and mount hard drive for data storage
- block:
  - name: format data hard drive
    filesystem:
      fstype: ext4
      dev: "/dev/{{ data_disk }}"

  - name: mount hard drive
    mount:
      path: '{{ data_path }}'
      src: '/dev/{{ data_disk }}'
      fstype: ext4
      state: mounted

  when: (data_disk | length > 0) and gcp is not defined

# copy custom scripts to node in order to later import them
- name: copy scripts to node
  copy:
    dest: '{{ script_path }}'
    src: ../../../scripts
    mode: 'u=rwx,g=rwx,o=rx'
