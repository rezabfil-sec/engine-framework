---
# Coordinate and run experiment

# Workflow:
#---------
# 0 Create LXC containers
# 1 Network
#   Qdisc
#   OVS
# 2 Stack
# 3 Actions
# 4 Start + Stop measurement phase
# 5 Post-Process
# 6 Collect artefacts
# 7 Cleanup

# ---------------------- Basic setup --------------------------

- name: get list of nodes used in experiment
  block:
  - name: run get_used_nodes script
    # Important: Do not use "{{ ... }}" but '{{ ... }}' in combination with to_json! to_json uses format {"key": "value", ... }.
    script: files/get_used_nodes.py '{{ network[experiment.network].flows.values() | list | to_json }}' '{{ stacks[experiment.stack].services.keys() | list | to_json }}' '{{ hostvars.localhost.node_mapping | to_json }}'
    register: experiment_nodes_out

  - name: reset experiment_nodes
    set_fact:
      experiment_nodes: []

  - name: set experiment_nodes fact
    set_fact:
      experiment_nodes: "{{ experiment_nodes_out.stdout | from_json }}"

  delegate_to: localhost
  connection: local
  run_once: true
  when: network_config == "SRIOV" and hostvars.localhost.containers.keys() | length > 0

- block:
  - name: nodes for OvS and Physical setup
    set_fact:
      experiment_nodes: []

  - name: set experiment_nodes fact
    set_fact:
      experiment_nodes: '{{ hostvars.localhost.node_mapping | to_json }}'

  when: network_config == "OvS" or network_config == "Physical" or (network_config == "SRIOV" and hostvars.localhost.containers.keys() | length < 1)

# Check used nodes
- name: debug experiment nodes
  debug:
    var: experiment_nodes
  delegate_to: localhost
  connection: local
  run_once: true

# Use node aliases
- name: load node alias
  set_fact:
    node: '{{ item.key }}'
  when: inventory_hostname == item.value
  loop: '{{ node_mapping | dict2items }}'
  tags: always

# ToDo: move this to per scenario level and use directory of experiment storage
# If not done, cannot run multiple instances of EnGINE workflow in parallel 
- name: experiment tmp dir
  block:
  - name: remove experiment tmp dir
    file:
      path: "{{ experiment_tmp_dir }}"
      state: absent
  - name: remove experiment tmp dir
    file:
      path: tmp
      state: absent
  - name: create experiment tmp dir
    file:
      path: "{{ experiment_tmp_dir }}"
      state: directory

  delegate_to: localhost
  connection: local
  run_once: true

# Adding to fix qdiscs not working well in the containers
- name: sriov setup
  include_role:
    name: roles/setup
    tasks_from: setup_sriov.yml
    apply:
      tags: [ setup, basic ]
  tags: [ setup, basic ]
  when: network_config == "SRIOV" and is_container is not defined and hostvars.localhost.containers.keys() | length > 0

# ---------------------- Create host containers -------------------

# Freshly create host containers needed for experiment
# This also wipes existing containers from last experiment run
- name: Create host containers
  include_role:
    name: roles/setup
    tasks_from: create_host_containers.yml
  when: is_container is not defined and inventory_hostname in hostvars.localhost.containers.keys()

# TODO: Do we need this?
# Here full of info about ifaces on meld
#- name: remove duplicates hw
#  set_fact:
#    used_hw_ifaces_host: "{{ used_hw_ifaces_host | unique }}"
#- name: remove duplicates sr-iov
#  set_fact:
#    used_sriov_ifaces_host: "{{ used_sriov_ifaces_host | unique }}"
#- debug: var=used_sriov_ifaces_host
#- debug: var=used_hw_ifaces_host
#

- name: debug inventory_hostname for containers
  debug:
    var: inventory_hostname
  when: is_container is defined and is_container

# Run setup required in containers
# Note: The setup scripts are the same executed on physical hosts
- name: Basic setup on containers
  include_role:
    name: roles/setup
    tasks_from: setup_node.yml
  when: is_container is defined and is_container and inventory_hostname in experiment_nodes 

# Run PTP setup for Kata containers (uses ptp_kvm)
- name: Kata PTP setup
  include_role:
    name: roles/setup
    tasks_from: setup_ptp_kata.yml
  when: is_container is defined and is_container and inventory_hostname in experiment_nodes and containerd_runtime == 'io.containerd.run.kata.v2' 

# ---------------------- Run experiment --------------------------

- name: execute experiment tasks if node is part of node mapping
  include_tasks: run_experiment.yml
  when: inventory_hostname in experiment_nodes

# ------------------------- [7] Cleanup ------------------------------

# Not needed in containers since they are wiped anyways
- name: delete processing files
  file:
    state: absent
    path: '{{data_path}}/process/'
  when: is_container is not defined

# Should be done for containers as well.
# This is the case because physical interfaces might be moved to container and they are not visible on
# physical anymore.
- name: cleanup network
  include_role:
    name: roles/network
    tasks_from: cleanup.yml
    apply:
      tags: cleanup
  tags: cleanup
  when: inventory_hostname in experiment_nodes and gcp is not defined # GCP doesn't have the services here

- name: cleanup NDN
  include_role:
    name: roles/ndn
    tasks_from: cleanup.yml
    apply:
      tags: cleanup
  tags: cleanup
  when: ndn is defined and ndn is true

- name: delete all containers
  block:
  - name: Get all existing containers for delete
    command: "lxc-ls -1"
    register: existing_containers

  - name: delete containers
    lxc_container:
      name: "{{ con }}"
      state: absent
    loop: '{{ existing_containers.stdout_lines }}'
    loop_control:
      loop_var: con
  when: is_container is not defined and container_runtime == "lxc"

- name: cleanup containerd containers and networks
  include_role:
    name: roles/setup
    tasks_from: cleanup_containerd.yml
    apply:
      tags: cleanup
  when: is_container is not defined and container_runtime == "containerd" and inventory_hostname in hostvars["localhost"]["containers"].keys() 

- name: reset experiment variables
  set_fact:
    node: 'node-0'
    flows: []
    qdisc_config: ''
    iface_config: ''
    services: []
    protocol: []
    action: []
    service_signals: 0
    used_sriov_ifaces_host: []
    used_hw_ifaces_host: []
  tags: cleanup

# ToDo - possibly remove
- name: remove experiment tmp dir
  file:
    path: "{{ experiment_tmp_dir }}"
    state: absent
  delegate_to: localhost
  connection: local
  run_once: true
