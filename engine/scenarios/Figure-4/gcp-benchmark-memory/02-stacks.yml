      node-3:
        - { name: fio, fio_config: 'fio-seq-read', fio_size: 10G, fio_runtime: 300, fio_io_depth: 32, fio_direct: 1,fio_block_size: '128k', fio_location: '/data/fio', signal: yes }
      node-5:
        - { name: fio, fio_config: 'fio-seq-read', fio_size: 10G, fio_runtime: 300, fio_io_depth: 32, fio_direct: 1,fio_block_size: '128k', fio_location: '/data/fio', signal: yes }
    protocols: {}
  stack-4:
