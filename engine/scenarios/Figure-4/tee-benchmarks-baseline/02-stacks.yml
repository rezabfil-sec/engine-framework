  stack-7:
    name: 'fio sequential reads'
    services:
      node-2:
      # https://cloud.google.com/compute/docs/disks/benchmarking-pd-performance
        - { name: fio, fio_config: 'fio-seq-read', fio_size: 10G, fio_runtime: 60, fio_io_depth: 64, fio_direct: 1,fio_block_size: '1M', fio_location: '/data/fio', signal: yes }
    protocols: {}

  stack-11:
    name: 'tls traffic benchmark pdu 128'
    services:
      node-1:
        - { name: tls_traffic_bench, mode: 'server', port: 12341, packet_size: 128, level: 1 }
        - { name: tcpdump, file: 'tls-dump', flows: yes, filter: "tcp port 12341", iostats: yes, level: 0 }
      node-2:
        - { name: tls_traffic_bench, mode: 'client', dest_ip: '10.1.1.9', port: 12341, packet_size: 128, data_size_mb: 5000, signal: yes, sync_start: yes, level: 2 }
        - { name: tcpdump, file: 'tls-dump', flows: yes, filter: "tcp port 12341", iostats: yes, level: 0 }
    protocols: {}

