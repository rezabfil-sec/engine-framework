# TODO: This has to be done in case non-container node uses flow with SR-IOV interface somewhere else (prob sriov_flows.py)
- name: set physical interface up if VF is used
  shell: "ip link set {{ node_ifaces[(iface|string).split('.')[0]|int].name }} up"
  when: (iface|string).split('.') | length > 1
  loop: "{{ container.ifaces }}"
  loop_control:
    loop_var: iface
  register: iface_up

#- name: delete container
#  lxc_container:
#    name: "{{ container.name }}"
#    state: absent

- name: create container
  lxc_container:
    name: "{{ container.name }}"
    template: download
    state: stopped
    # fs_size: 2G
    # template_options: --dist debian --release bullseye --arch amd64
    template_options: --dist ubuntu --release jammy --arch amd64

# - name: debug variables
#   debug:
#     msg: "{{ node_ifaces[(iface|string).split('.')[0] |int].name}}{{'v' + (iface|string).split('.')[1] if (iface|string).split('.') | length > 1 }}"
#   loop: "{{ container.ifaces }}"
#   loop_control:
#     loop_var: iface
#     index_var: index

- name: add container interface config
  lxc_container:
    name: "{{ container.name }}"
    state: stopped
    container_config:
      # - "lxc.rootfs.options = idmap=container"
      # - "lxc.cgroup.memory.limit_in_bytes = 2560M"
      - "lxc.apparmor.profile = unconfined"
      - "lxc.net.{{ index + 1 }}.type = phys"
      - "lxc.net.{{ index + 1 }}.link = {{ node_ifaces[(iface|string).split('.')[0] |int].name}}{{'v' + (iface|string).split('.')[1] if (iface|string).split('.') | length > 1 }}"
      - "lxc.net.{{ index + 1 }}.name = eno{{ index + 1 }}"
  loop: "{{ container.ifaces }}"
  loop_control:
    loop_var: iface
    index_var: index

